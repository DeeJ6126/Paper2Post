# Paper2Post 运行配置
# 所有键均可被 CLI 参数覆盖。

# LLM Provider: openai | mock | anthropic
provider: openai

model: gpt-4o-mini
temperature: 0.7
max_tokens: 4096

# 默认推文配置
article_type: deep_review        # deep_review | speed | methods | resource
target_audience: biology_graduate
article_length: 2500
language: zh-CN
style: academic_popularization

# Prompt 模板目录（相对工程根目录）
prompts_dir: prompts

# 中间结果是否写入磁盘（缓存支持）
save_intermediates: true
